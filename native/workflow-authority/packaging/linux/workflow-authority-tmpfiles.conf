# Install as /usr/lib/tmpfiles.d/workflow-authority.conf.
# Type d rejects a non-directory at this exact path; the socket unit separately
# refuses a symbolic link before binding authority.sock.
d /etc/design-machines/workflow-authority 0755 root root -
d /etc/design-machines/workflow-authority/credentials 0700 root root -
d /etc/design-machines/workflow-authority/trust 0755 root root -
d /var/lib/design-machines/workflow-authority 0700 root root -
d /run/design-machines/workflow-authority 0750 root workflow-authority -
