<!--
  Plan section body. Fills the base.html BODY slot for kind "plan".
  Layout-aware per the assembly-baseplate plans/ convention:
    - Full-mode SIBLING_NAV links assessment.html, research.html, and prompts/;
      Lean SIBLING_NAV omits prompts/ because that directory does not exist.
    - EXECUTION_SCOPE_HEADING and EXECUTION_SCOPE_BODY are filled according to
      the approved mode; see templates/README.md for the exact contract.
  Island schema (feature plan):
    { artifact:"plan", slug, baseBranch, featureBranch,
      branchMode:"create|reuse", expectedFeatureHead,
      chunks:[{ n:"01", slug:"reader-service", scope, acceptance, deps:[] }],
      // chunks is full-mode-only; Lean carries its single-pass scope in prose.
      decisions:[{ id, decision, rationale, alternatives }],
      requirementsCoverage:[{ requirement, chunk }] } // Lean uses chunk:"single-pass scope".
  Epic-plan variant: fill the execution-scope section with the sub-plan roadmap
    and emit "subPlans":[{ n, slug, featureDir }] instead of "chunks".
  Full-mode chunk tables and all decision tables use the decision-table widget
    (editable + copy-back).
-->
<h1>Plan: {{FEATURE_NAME}}</h1>

<section aria-labelledby="overview">
  <h2 id="overview">Overview</h2>
  {{OVERVIEW}}
</section>

<section aria-labelledby="execution-scope">
  <h2 id="execution-scope">{{EXECUTION_SCOPE_HEADING}}</h2>
  {{EXECUTION_SCOPE_BODY}}
</section>

<section aria-labelledby="decisions" class="widget--edit" data-island-key="decisions">
  <h2 id="decisions">Decisions &amp; Tradeoffs</h2>
  {{DECISION_TABLE}}
</section>

<section aria-labelledby="coverage">
  <h2 id="coverage">Requirements Coverage</h2>
  <p>Maps each approved Key Requirement (from <a href="assessment.html">assessment.html</a>) to the applicable execution scope that satisfies it.</p>
  {{COVERAGE_TABLE}}
</section>
